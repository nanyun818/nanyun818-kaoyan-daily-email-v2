name: Daily Kaoyan Email v2

run-name: 每日考研邮件 v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".run-email-v2"
  schedule:
    # 00:07 UTC = 08:07 Asia/Shanghai. Avoid the top of the hour.
    - cron: "7 0 * * *"

permissions:
  contents: read

concurrency:
  group: daily-kaoyan-email-v2
  cancel-in-progress: true

jobs:
  send-email-v2:
    name: Generate and send email v2
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send daily email
        run: python daily_email.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
